; Include explicitly after reviewing this file on the test PBX.
; Existing ats-out/from-mcm/ats-in contexts are not replaced.
[ats-beta]
exten => _+X.,1,NoOp(ATS beta outbound)
 same => n,GotoIf($[${REGEX("^[+]7[0-9]{10}$" ${EXTEN})} = 0]?reject)
 same => n,GotoIf($[${REGEX("^[0-9a-f-]{36}$" ${ATS_ATTEMPT_ID})} = 0]?reject)
 same => n,Set(ATS_MCM_DST=8${EXTEN:2})
 same => n,Dial(PJSIP/${ATS_MCM_DST}@mcm,30)
 same => n,Hangup()
 same => n(reject),Hangup(21)
exten => h,1,NoOp(ATS beta final event)
 same => n,GotoIf($[${REGEX("^[0-9a-f-]{36}$" ${ATS_ATTEMPT_ID})} = 0]?done)
 ; Answered calls report the media/bridge result from ats-beta-answer.
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?done)
 same => n,UserEvent(ATSCall,AttemptID: ${ATS_ATTEMPT_ID},State: failed,DialStatus: ${DIALSTATUS})
 same => n(done),NoOp(ATS beta ended)

[ats-beta-answer]
exten => s,1,UserEvent(ATSCall,AttemptID: ${ATS_ATTEMPT_ID},State: answered)
 same => n,Set(ATS_RESULT=failed)
 same => n,Set(ATS_REASON=playback_failed)
 same => n,GotoIf($["${ATS_MEDIA}" = "1"]?media)
 same => n,Playback(hello-world)
 same => n,ExecIf($["${PLAYBACKSTATUS}" = "SUCCESS"]?Set(ATS_RESULT=completed))
 same => n,ExecIf($["${PLAYBACKSTATUS}" = "SUCCESS"]?Set(ATS_REASON=))
 same => n,Hangup()
 same => n(media),MixMonitor(/var/spool/asterisk/monitor/ats-beta/${ATS_ATTEMPT_ID}.wav)
 same => n,Set(ATS_REASON=media_failed)
 same => n,AGI(ats_beta.py)
 same => n,ExecIf($["${ATS_RESULT}" = "completed"]?Set(ATS_REASON=))
 same => n,GotoIf($["${ATS_TRANSFER}" != "1"]?done)
 same => n,GotoIf($[${REGEX("^[0-9]{1,20}$" ${ATS_OPERATOR_EXT})} = 0]?done)
 same => n,Dial(PJSIP/${ATS_OPERATOR_EXT},30)
 same => n,ExecIf($["${DIALSTATUS}" != "ANSWER"]?Set(ATS_RESULT=failed))
 same => n,ExecIf($["${DIALSTATUS}" != "ANSWER"]?Set(ATS_REASON=operator_unavailable))
 same => n(done),StopMixMonitor()
 same => n,Hangup()
exten => h,1,UserEvent(ATSCall,AttemptID: ${ATS_ATTEMPT_ID},State: ${ATS_RESULT},ResultB64: ${ATS_RESULT_B64},ReasonCode: ${ATS_REASON})
