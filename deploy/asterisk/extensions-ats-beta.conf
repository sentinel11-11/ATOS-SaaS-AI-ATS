; REVIEW ON THE TEST PBX BEFORE USE. Include explicitly from extensions.conf.
; User's existing endpoint: mcm. Validate it on the isolated beta PBX before use.
; ATS supplies only an E.164 destination and an inherited UUID.
; The AMI account must not have Command/config/file-management privileges.
[ats-beta]
exten => _+X.,1,NoOp(ATS beta outbound)
 same => n,GotoIf($[${REGEX("^[+]7[0-9]{10}$" ${EXTEN})} = 0]?reject)
 same => n,GotoIf($[${REGEX("^[0-9a-f-]{36}$" ${ATS_ATTEMPT_ID})} = 0]?reject)
 ; Multicom contract for this beta: ru8 destination; CLI is supplied as d10 by AMI.
 same => n,Set(ATS_MCM_DST=8${EXTEN:2})
 same => n,Dial(PJSIP/${ATS_MCM_DST}@mcm,30)
 same => n,Hangup()
 same => n(reject),Hangup(21)
exten => h,1,NoOp(ATS beta final event)
 same => n,GotoIf($[${REGEX("^[0-9a-f-]{36}$" ${ATS_ATTEMPT_ID})} = 0]?done)
 same => n,UserEvent(ATSCall,AttemptID: ${ATS_ATTEMPT_ID},State: ${IF($["${DIALSTATUS}" = "ANSWER"]?completed:failed)})
 same => n(done),NoOp(ATS beta ended)

[ats-beta-answer]
exten => s,1,UserEvent(ATSCall,AttemptID: ${ATS_ATTEMPT_ID},State: answered)
 ; A prerecorded consented TEST prompt. Replace only after checking the media file.
 same => n,Playback(hello-world)
 same => n,Hangup()
