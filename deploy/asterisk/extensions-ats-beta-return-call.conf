; Gosub from the trusted Multicom inbound channel before Answer or the usual queue.
; When no operator answers, Return continues execution in the existing context.
[ats-beta-return-call]
exten => s,1,Set(ATS_RETURN_DIAL=)
 same => n,Set(SHARED(ATS_RETURN_CONNECTED)=0)
 same => n,AGI(ats_return_call.py,resolve,${ARG1})
 same => n,GotoIf($["${ATS_RETURN_DIAL}" = ""]?fallback)
 same => n,Set(CHANNEL(hangup_handler_push)=ats-beta-return-call-end,s,1(${ATS_RETURN_ID}))
 same => n,Dial(${ATS_RETURN_DIAL},${ATS_RETURN_RING},gib(ats-beta-return-call-header^s^1(${ATS_RETURN_TOKEN}^${ATS_RETURN_CALLER}))U(ats-beta-return-call-answer^${ATS_RETURN_ID}^${CHANNEL})S(${ATS_RETURN_TALK}))
 same => n,AGI(ats_return_call.py,release,${ATS_RETURN_ID})
 same => n,Set(CHANNEL(hangup_handler_pop)=)
 same => n,GotoIf($["${SHARED(ATS_RETURN_CONNECTED)}" = "1"]?done)
 same => n(fallback),Return()
 same => n(done),Hangup()

[ats-beta-return-call-header]
exten => s,1,ExecIf($["${ARG1}" != ""]?Set(PJSIP_HEADER(add,X-RATS-Call-Token)=${ARG1}))
 same => n,ExecIf($["${ARG2}" != ""]?Set(CALLERID(num)=${ARG2}))
 same => n,Return()

[ats-beta-return-call-answer]
exten => s,1,Set(ATS_RETURN_ACCEPTED=0)
 same => n,AGI(ats_return_call.py,answer,${ARG1})
 same => n,ExecIf($["${ATS_RETURN_ACCEPTED}" != "1"]?Set(GOSUB_RESULT=CONTINUE))
 same => n,ExecIf($["${ATS_RETURN_ACCEPTED}" = "1"]?Set(SHARED(ATS_RETURN_CONNECTED,${ARG2})=1))
 same => n,Return()

[ats-beta-return-call-end]
exten => s,1,Set(AGISIGHUP=no)
 same => n,AGI(ats_return_call.py,hangup,${ARG1})
 same => n,Return()
