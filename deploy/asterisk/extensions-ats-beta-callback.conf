; Operator-first callback. Customer dialing still requires authorization from ATOS.
; ATOS_CALLBACK_VERSION=3
[ats-beta-callback-operator]
exten => _+X.,1,NoOp(ATS beta mobile operator leg)
 same => n,GotoIf($[${REGEX("^[+]7[0-9]{10}$" ${EXTEN})} = 0]?reject)
 same => n,GotoIf($[${REGEX("^[0-9a-f-]{36}$" ${ATS_ATTEMPT_ID})} = 0]?reject)
 same => n,GotoIf($[${REGEX("^mcm-cli-[0-9]{10}$" ${ATS_TRUNK})} = 0]?reject)
 same => n,Set(ATS_OPERATOR_DST=8${EXTEN:2})
 same => n,Dial(PJSIP/${ATS_OPERATOR_DST}@${ATS_TRUNK},30,b(ats-beta-callback-created^s^1(operator))U(ats-beta-callback-answered^operator))
 same => n,Hangup()
 same => n(reject),Hangup(21)
exten => h,1,GotoIf($["${DIALSTATUS}" = "ANSWER"]?done)
 same => n,Set(ATS_CALLBACK_REASON=operator_unavailable)
 same => n,ExecIf($["${DIALSTATUS}" = "BUSY"]?Set(ATS_CALLBACK_REASON=operator_busy))
 same => n,ExecIf($["${DIALSTATUS}" = "NOANSWER"]?Set(ATS_CALLBACK_REASON=operator_no_answer))
 same => n,UserEvent(ATSCallback,AttemptID: ${ATS_ATTEMPT_ID},Leg: operator,State: failed,ReasonCode: ${ATS_CALLBACK_REASON},DialStatus: ${DIALSTATUS})
 same => n(done),NoOp(ATS beta operator leg finished)

[ats-beta-callback-created]
exten => s,1,ExecIf($["${ARG1}" = "operator" & "${ATS_BROWSER_CALL}" = "1"]?Set(PJSIP_HEADER(add,X-RATS-Call-Token)=${ATS_OPERATOR_CALL_TOKEN}))
 same => n,UserEvent(ATSCallback,AttemptID: ${ATS_ATTEMPT_ID},Leg: ${ARG1},State: created)
 same => n,Return()

[ats-beta-callback-answered]
exten => s,1,UserEvent(ATSCallback,AttemptID: ${ATS_ATTEMPT_ID},Leg: ${ARG1},State: answered)
 same => n,Return()

[ats-beta-callback-customer]
exten => s,1,Set(ATS_CALLBACK_RESULT=failed)
 same => n,Set(DIALSTATUS=)
 same => n,Set(ATS_CALLBACK_REASON=callback_parameters_invalid)
 same => n,GotoIf($[${REGEX("^[0-9a-f-]{36}$" ${ATS_ATTEMPT_ID})} = 0]?done)
 same => n,GotoIf($[${REGEX("^[+]7[0-9]{10}$" ${ATS_CUSTOMER_PHONE})} = 0]?done)
 same => n,GotoIf($[${REGEX("^mcm-cli-[0-9]{10}$" ${ATS_TRUNK})} = 0]?done)
 same => n,GotoIf($[${REGEX("^[0-9]{2,4}$" ${ATS_CALLBACK_MAX_SECONDS})} = 0]?done)
 same => n,Set(TIMEOUT(absolute)=${ATS_CALLBACK_MAX_SECONDS})
 same => n,Set(ATS_CALLBACK_REASON=callback_authorization_timeout)
 same => n,Set(ATS_CALLBACK_DECISION=pending)
 same => n,Set(ATS_CALLBACK_TRIES=0)
 same => n,Set(ATS_READY_SOURCE=network_answer)
 same => n,ExecIf($["${ATS_BROWSER_CALL}" = "1"]?Set(ATS_READY_SOURCE=browser))
 same => n,UserEvent(ATSCallback,AttemptID: ${ATS_ATTEMPT_ID},Leg: operator,State: ready,ReadySource: ${ATS_READY_SOURCE})
 same => n(wait),GotoIf($["${ATS_CALLBACK_DECISION}" = "allow"]?dial)
 same => n,GotoIf($["${ATS_CALLBACK_DECISION}" = "deny"]?denied)
 same => n,GotoIf($[${ATS_CALLBACK_TRIES} >= 15]?done)
 same => n,Wait(1)
 same => n,Set(ATS_CALLBACK_TRIES=$[${ATS_CALLBACK_TRIES} + 1])
 same => n,Goto(wait)
 same => n(denied),Set(ATS_CALLBACK_REASON=callback_gate_denied)
 same => n,Goto(done)
 same => n(dial),Set(ATS_CUSTOMER_DST=8${ATS_CUSTOMER_PHONE:2})
 same => n,Set(ATS_CALLBACK_REASON=customer_unavailable)
 same => n,ExecIf($["${ATS_RECORD_CALLBACK}" = "1"]?MixMonitor(/var/spool/asterisk/monitor/ats-beta/${ATS_ATTEMPT_ID}.wav))
 same => n,Dial(PJSIP/${ATS_CUSTOMER_DST}@${ATS_TRUNK},30,b(ats-beta-callback-created^s^1(customer))U(ats-beta-callback-answered^customer))
 same => n(done),Hangup()
exten => h,1,ExecIf($["${DIALSTATUS}" = "ANSWER"]?Set(ATS_CALLBACK_RESULT=completed))
 same => n,ExecIf($["${DIALSTATUS}" = "ANSWER"]?Set(ATS_CALLBACK_REASON=))
 same => n,ExecIf($["${DIALSTATUS}" = "BUSY"]?Set(ATS_CALLBACK_REASON=customer_busy))
 same => n,ExecIf($["${DIALSTATUS}" = "NOANSWER"]?Set(ATS_CALLBACK_REASON=customer_no_answer))
 same => n,ExecIf($["${DIALSTATUS}" = "CANCEL"]?Set(ATS_CALLBACK_REASON=operator_cancelled))
 same => n,StopMixMonitor()
 same => n,UserEvent(ATSCallback,AttemptID: ${ATS_ATTEMPT_ID},Leg: customer,State: ${ATS_CALLBACK_RESULT},ReasonCode: ${ATS_CALLBACK_REASON},DialStatus: ${DIALSTATUS})

[ats-beta-callback-browser]
exten => _[0-9a-f].,1,NoOp(ATS beta browser operator leg)
 same => n,GotoIf($[${REGEX("^[0-9a-f-]{36}$" ${EXTEN})} = 0]?reject)
 same => n,GotoIf($[${REGEX("^ats-web-[a-f0-9]{12,32}$" ${ATS_OPERATOR_ENDPOINT})} = 0]?reject)
 same => n,GotoIf($[${REGEX("^[a-f0-9]{48}$" ${ATS_OPERATOR_CALL_TOKEN})} = 0]?reject)
 same => n,Dial(PJSIP/${ATS_OPERATOR_ENDPOINT},30,b(ats-beta-callback-created^s^1(operator))U(ats-beta-callback-answered^operator))
 same => n,Hangup()
 same => n(reject),Hangup(21)
exten => h,1,GotoIf($["${DIALSTATUS}" = "ANSWER"]?done)
 same => n,UserEvent(ATSCallback,AttemptID: ${ATS_ATTEMPT_ID},Leg: operator,State: failed,ReasonCode: operator_unavailable,DialStatus: ${DIALSTATUS})
 same => n(done),NoOp(ATS beta browser leg finished)

[ats-beta-webrtc-deny]
exten => _.,1,Hangup(21)
exten => s,1,Hangup(21)
