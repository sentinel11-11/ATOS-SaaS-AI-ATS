; Optional diagnostic answer context. Select ats-beta-echo in the ATOS AMI profile.
; Echo ends on #, remote Hangup, or the absolute 30-second limit.
[ats-beta-echo]
exten => s,1,Set(ATS_RESULT=completed)
 same => n,Set(TIMEOUT(absolute)=30)
 same => n,UserEvent(ATSCall,AttemptID: ${ATS_ATTEMPT_ID},State: answered)
 same => n,Echo()
 same => n,Hangup()
exten => h,1,UserEvent(ATSCall,AttemptID: ${ATS_ATTEMPT_ID},State: ${ATS_RESULT})
