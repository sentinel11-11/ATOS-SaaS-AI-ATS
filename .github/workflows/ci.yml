name: verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test-only-in-ci
          POSTGRES_DB: ats_test
        ports: ['5432:5432']
        options: --health-cmd=pg_isready --health-interval=2s --health-timeout=3s --health-retries=20
    env:
      ATS_TEST_DATABASE_URL: postgresql+psycopg://postgres:test-only-in-ci@localhost:5432/ats_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --frozen
      - run: uv run ruff check src tests scripts migrations
      - run: uv run pytest --junitxml=artifacts/backend-tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-evidence-${{ matrix.python-version }}
          path: artifacts/backend-tests.xml
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate
      - name: Audit all frontend dependencies
        run: npm audit --audit-level=moderate
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
  native-callback:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test-only-in-ci
          POSTGRES_DB: ats_test_native
        ports: ['5432:5432']
        options: --health-cmd=pg_isready --health-interval=2s --health-timeout=3s --health-retries=20
    env:
      ATS_TEST_DATABASE_URL: postgresql+psycopg://postgres:test-only-in-ci@localhost:5432/ats_test_native
      PYTHONPATH: tests
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --frozen
      - run: mkdir -p .runtime artifacts
      - run: docker pull andrius/asterisk:20@sha256:05391d46660b1dcadd193e265758fb06a785ad484b7add2a0cb0ba5e50a76929
      - run: uv run pytest tests/native/callback_smoke.py --junitxml=artifacts/native-callback.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-callback-evidence
          path: |
            artifacts/native-callback.xml
            .runtime/callback-native-*.log
            .runtime/callback-native-*-peer.json
  integration:
    needs: frontend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test-only-in-ci
          POSTGRES_DB: ats_smoke
        ports: ['5432:5432']
        options: --health-cmd=pg_isready --health-interval=2s --health-timeout=3s --health-retries=20
    env:
      ATS_DATABASE_URL: postgresql+psycopg://postgres:test-only-in-ci@localhost:5432/ats_smoke
      ATS_LIVE_CALLS_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --frozen
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - run: uv run alembic upgrade head
      - run: uv run python scripts/smoke.py
      - run: uv run python scripts/check-database.py --container "${{ job.services.postgres.id }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-evidence
          path: |
            artifacts/http-smoke.json
            artifacts/database-check.json
            artifacts/smoke-process-*.log
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --frozen
      - run: mkdir -p artifacts
      - run: uv run pip-audit --progress-spinner off --format json --output artifacts/pip-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-evidence
          path: artifacts/pip-audit.json
